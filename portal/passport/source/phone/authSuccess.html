<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta
      http-equiv="cache-control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <link
      rel="stylesheet"
      href="../../../../material/custom/custom.css"
      type="text/css"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"
    />
    <script
      type="text/javascript"
      src="../../../../material/custom/jquery-2.1.3.min.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/detectMobileBrowser.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/custom.js"
    ></script>
    <script>
      var _configId;
      var _isSocialPage;
      var _isMobilePage = true;
    </script>

    <script
      type="text/javascript"
      src="../../../../material/custom/lang/common-zh.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/success.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/lang/success-zh.js"
    ></script>
    <link rel="stylesheet" href="template.css" type="text/css" />
    <script type="text/javascript" src="template.js"></script>
    <title>{{common.loginSuccess}}</title>
  </head>
  <body class="wifi-page passport-page success-page device-phone">
    <main class="wifi-shell detail-shell">
      <nav class="detail-nav">
        <a class="back-link" href="#" onclick="logout();return false;" aria-label="{{common.back}}">
          <img class="back-icon" src="assets/back.svg" alt="" />
        </a>
      </nav>

      <header class="welcome-block">
        <h1>{{passport.welcome}}</h1>
        <p>{{passport.welcomeEn}}</p>
      </header>

      <section class="auth-card success-card">
        <div class="auth-heading success-heading">
          <h2>{{common.loginSuccess}}</h2>
          <p>{{common.loginSuccessEn}}</p>
        </div>

        <img class="success-visual" src="assets/success.png" alt="" />

        <div class="success-message">
          <h3>{{success.accessNow}}</h3>
          <p>{{success.accessNowEn}}</p>
        </div>

        <div class="portal-action">
          <span class="portal-action-label">
            <strong>{{common.logout}}</strong>
            <small>{{common.logoutEn}}</small>
          </span>
          <input
            id="logoutBtn"
            class="portal-action-control"
            onclick="logout()"
            type="button"
            value="{{common.logout}}"
            aria-label="{{common.logout}}"
          />
        </div>
      </section>
    </main>
  </body>
</html>
