<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta
      http-equiv="cache-control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=2.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="../../../../material/custom/custom.css"
      type="text/css"
    />
    <script
      type="text/javascript"
      src="../../../../material/custom/jquery-2.1.3.min.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/detectMobileBrowser.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/slidejs/jquery.slides.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/custom.js"
    ></script>
    <script>
      var _configId;
      var _isSocialPage;
      var _isMobilePage = true;
    </script>

    <script
      type="text/javascript"
      src="../../../../material/custom/lang/common-zh.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/auth.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/check.js"
    ></script>
    <link rel="stylesheet" href="template.css" type="text/css" />
    <script type="text/javascript" src="template.js"></script>
    <title>{{common.userNotice}}</title>
  </head>
  <body
    style="
      background-repeat: repeat;
      background-position: center center;
      background-color: #dbe5f1;
    "
  >
    <p
      style="
        padding: 15px 0px;
        font-size: 24px;
        color: white;
        background-color: #4d8eba;
        text-align: center;
      "
    >
      <a id="turnBackLink" href="#" onclick="turnRegisterPage()">&lt;{{common.back}}</a
      >{{common.userNotice}}
    </p>
    <p>&nbsp;</p>
    <div
      style="
        width: 80%;
        height: 90%;
        overflow-y: auto;
        padding: 10px;
        line-height: 25px;
        margin: 0 auto;
        background-color: white;
      "
    >
      <p style="text-align: center; font-size: 19px; margin-bottom: 10px">
        {{agreement.title}}
      </p>
      <p style="font-size: 15px">
        {{agreement.introStart}}
        /
        {{agreement.introEnd}}
      </p>
      <p style="font-size: 15px; margin-top: 5px">
        1. {{agreement.item1}}
      </p>
      <p style="font-size: 15px; margin-top: 5px">
        2.
        {{agreement.item2}}
      </p>
      <p style="font-size: 15px; margin-top: 5px">
        3. {{agreement.item3}}
      </p>
    </div>
    <p>&nbsp;</p>
    <p
      style="display: none"
      data-background="background-repeat:repeat; background-position:center center; background-color:#F2F2F2;"
    ></p>
  </body>
</html>
