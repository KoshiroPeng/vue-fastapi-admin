<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta
      http-equiv="cache-control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="../../../../material/custom/custom.css"
      type="text/css"
    />
    <script
      type="text/javascript"
      src="../../../../material/custom/jquery-2.1.3.min.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/custom.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/auth.js"
    ></script>
    <script
      type="text/javascript"
      src="../../../../material/custom/lang/common-zh.js"
    ></script>
    <script>
      var _configId;
      var _isSocialPage;
      var _isMobilePage = true;
    </script>
    <link rel="stylesheet" href="template.css" type="text/css" />
    <title>{{common.userNotice}}</title>
  </head>

  <body>
    <div class="moveContainer" id="p1468394844509">
      <div
        class="pageeditor"
        typenum="1"
        style="
          text-align: center;
          font-size: 21px;
          color: rgb(255, 255, 255);
          margin: 0px;
          border: 0px solid rgb(74, 201, 255);
          padding: 0px;
          border-radius: 0px;
          background-color: #0077ff;
        "
      >
        <div class="pContainer column">
          <div
            class="unClick"
            style="position: absolute; width: 100%; height: 100%"
          ></div>
          <div
            class="contentmain contentlevel htmlContainer"
            style="height: 50px"
          >
            <p
              class=""
              style="
                display: table;
                width: 100%;
                table-layout: fixed;
                word-wrap: break-word;
                padding-top: 10px;
              "
            >
              {{common.userNotice}}
            </p>
          </div>
        </div>
      </div>
    </div>
    <div class="moveContainer setHeight" id="notes1468394847447">
      <div
        class="pageeditor center"
        typenum="20"
        setheight="472"
        style="
          height: 402px;
          margin: 0px 10px;
          border: 0px solid rgb(74, 201, 255);
          padding: 0px;
          border-radius: 0px;
          text-align: center;
          background-color: rgb(255, 255, 255);
          padding-top: 5px;
        "
      >
        <div class="notesContainer column htmlContainer">
          <div
            style="
              height: 100%;
              overflow-y: auto;
              padding: 10px;
              line-height: 25px;
              margin: 0 auto;
              background-color: #f4f4f4;
            "
          >
            <p style="font-size: 13px">{{agreement.title}}</p>
            <p style="font-size: 13px; margin-top: 5px; text-align: left">
              {{agreement.introStart}}
              /
              {{agreement.introEnd}}
            </p>
            <p style="font-size: 13px; margin-top: 5px; text-align: left">
              1. {{agreement.item1}}
            </p>
            <p style="font-size: 13px; margin-top: 5px; text-align: left">
              2.
              {{agreement.item2}}
            </p>
            <p style="font-size: 13px; margin-top: 5px; text-align: left">
              3. {{agreement.item3}}
            </p>
          </div>
        </div>
      </div>
    </div>
    <div class="moveContainer" id="notes1468394848189">
      <div
        class="pageeditor center editing"
        typenum="63"
        style="
          margin: 10px 0px;
          border: 0px solid rgb(74, 201, 255);
          padding: 0px;
          border-radius: 0px;
          background-color: rgb(255, 255, 255);
          padding-top: 15px;
        "
      >
        <div class="agreeContainer column htmlContainer">
          <div>
            <p style="text-align: center">
              <input
                id="agreeBtn"
                onclick="turnRegisterPage()"
                type="button"
                value="{{agreement.agree}}"
                class="frm-button borderRadius4"
                style="
                  height: 35px;
                  font-size: 18px;
                  width: 94%;
                  background-color: #0077ff;
                "
              />
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
