<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=EmulateIE7" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="../../../../material/custom/custom.css" type="text/css" />
    <link rel="stylesheet" href="template.css" type="text/css" />
    <script type="text/javascript" src="../../../../material/custom/jquery-2.1.3.min.js"></script>
    <script type="text/javascript" src="../../../../material/custom/custom.js"></script>
    <script>
      var _configId;
      var _isMobilePage = true;
      var _isSocialPage;
    </script>
    <script type="text/javascript" src="../../../../material/custom/lang/common-zh.js"></script>
    <script type="text/javascript" src="../../../../material/custom/auth.js"></script>
    <script type="text/javascript" src="../../../../material/custom/socialAuth.js"></script>
    <script type="text/javascript" src="../../../../material/custom/check.js"></script>
    <title>{{common.authentication}}</title>
  </head>

  <body class="wifi-page entry-page device-phone language-zh">
    <main class="wifi-shell entry-shell">
      <header class="welcome-block">
        <img class="entry-logo" src="assets/airport-logo.png" alt="{{common.airport}}" />
        <h1>{{entrance.welcome}}</h1>
        <p>{{entrance.welcomeEn}}</p>
      </header>

      <section class="entry-card" aria-labelledby="entry-title">
        <div class="entry-heading">
          <h2 id="entry-title">{{entrance.chooseMethod}}</h2>
          <p>{{entrance.chooseMethodEn}}</p>
        </div>

        <nav class="entry-options" aria-label="{{entrance.methodLabel}}">
          <a class="entry-option" href="#" folder="{{entrance.smsFolder}}" data-method="sms" onclick="turnToLanPage($(this)); return false;">
            <img src="assets/sms.png" alt="" class="entry-option-icon" />
            <span class="entry-option-copy"><strong>{{entrance.sms}}</strong><span>{{entrance.smsEn}}</span></span>
            <span class="entry-option-arrow" aria-hidden="true"></span>
          </a>
          <a class="entry-option" href="#" folder="{{entrance.passportFolder}}" data-method="passport" onclick="turnToLanPage($(this)); return false;">
            <img src="assets/passport.png" alt="" class="entry-option-icon" />
            <span class="entry-option-copy"><strong>{{entrance.passport}}</strong><span>{{entrance.passportEn}}</span></span>
            <span class="entry-option-arrow" aria-hidden="true"></span>
          </a>
          <!-- <a class="entry-option" href="#" folder="{{entrance.wechatFolder}}" data-method="wechat" onclick="turnToLanPage($(this)); return false;">
            <img src="assets/wechat.png" alt="" class="entry-option-icon" />
            <span class="entry-option-copy"><strong>{{entrance.wechat}}</strong><span>{{entrance.wechatEn}}</span></span>
            <span class="entry-option-arrow" aria-hidden="true"></span>
          </a>
          <a class="entry-option" href="#" folder="{{entrance.boardingPassFolder}}" data-method="boarding-pass" onclick="turnToLanPage($(this)); return false;">
            <img src="assets/boarding-pass.png" alt="" class="entry-option-icon" />
            <span class="entry-option-copy"><strong>{{entrance.boardingPass}}</strong><span>{{entrance.boardingPassEn}}</span></span>
            <span class="entry-option-arrow" aria-hidden="true"></span>
          </a>
          <a class="entry-option" href="#" folder="{{entrance.kioskFolder}}" data-method="kiosk-account" onclick="turnToLanPage($(this)); return false;">
            <img src="assets/kiosk-account.png" alt="" class="entry-option-icon" />
            <span class="entry-option-copy"><strong>{{entrance.kiosk}}</strong><span>{{entrance.kioskEn}}</span></span>
            <span class="entry-option-arrow" aria-hidden="true"></span>
          </a> -->
        </nav>

        <nav class="language-switch" aria-label="{{common.languageSwitch}}">
          <a class="lang-link" href="#" folder="{{entrance.simplifiedFolder}}" data-language="zh-cn" onclick="turnToLanPage($(this)); return false;">{{common.simplified}}</a>
          <a class="lang-link" href="#" folder="{{entrance.traditionalFolder}}" data-language="zh-tw" onclick="turnToLanPage($(this)); return false;">{{common.traditional}}</a>
        </nav>
      </section>
    </main>
  </body>
</html>
