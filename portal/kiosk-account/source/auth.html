<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=2.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="../../../../material/custom/custom.css" type="text/css" />
    <script type="text/javascript" src="../../../../material/custom/jquery-2.1.3.min.js"></script>
    <script type="text/javascript" src="../../../../material/custom/detectMobileBrowser.js"></script>
    <script type="text/javascript" src="../../../../material/custom/custom.js"></script>
    <script>
      var _configId;
      var _isSocialPage;
      var _isMobilePage = '{{device.isMobile}}'.toLowerCase() === 'true';
    </script>
    <script type="text/javascript" src="../../../../material/custom/lang/common-zh.js"></script>
    <script type="text/javascript" src="../../../../material/custom/auth.js"></script>
    <script type="text/javascript" src="../../../../material/custom/check.js"></script>
    <script type="text/javascript" src="../../../../material/custom/lang/auth-zh.js"></script>
    <link rel="stylesheet" href="template.css" type="text/css" />
    <script type="text/javascript" src="template.js"></script>
    <title>{{common.login}}</title>
  </head>

  <body class="wifi-page portal-auth-page kiosk-page auth-page {{device.class}} language-zh">
    <main class="wifi-shell detail-shell">
      <nav class="detail-nav">
        <a class="back-link" href="#" folder="{{kiosk.entranceFolder}}" onclick="turnToLanPage($(this));return false;" aria-label="{{common.backToMethods}}">
          <img class="back-icon" src="assets/back.svg" alt="" />
          <span class="back-text">{{common.back}}</span>
        </a>
      </nav>

      <header class="welcome-block">
        <h1>{{kiosk.welcome}}</h1>
        <p>{{kiosk.welcomeEn}}</p>
      </header>

      <section class="auth-card kiosk-card">
        <div class="auth-heading">
          <h2>{{kiosk.heading}}</h2>
          <p>{{kiosk.headingEn}}</p>
        </div>

        <div class="auth-notice" role="note">
          <img class="auth-notice-icon" src="assets/info.svg" alt="" />
          <div class="auth-notice-copy">
            <span>{{kiosk.notice}}</span>
            <small>{{kiosk.noticeEn}}</small>
          </div>
        </div>

        <div class="auth-fields kiosk-fields">
          <label class="auth-field">
            <img class="auth-field-icon" src="assets/account.svg" alt="" />
            <input id="username" class="portal-input" type="text" autocomplete="username" placeholder="{{kiosk.account}} ({{kiosk.accountEn}})" />
          </label>
          <label class="auth-field password-field">
            <img class="auth-field-icon" src="assets/password.svg" alt="" />
            <input id="password" class="portal-input" type="password" autocomplete="current-password" placeholder="{{kiosk.password}} ({{kiosk.passwordEn}})" />
            <button class="password-toggle" type="button" onclick="togglePasswordVisibility(this)" aria-label="{{kiosk.showPassword}}">
              <img src="assets/password-hidden.svg" alt="" />
            </button>
          </label>
        </div>

        <div class="agreement-row">
          <img class="agreement-check" id="agreeCheck" role="checkbox" aria-checked="true" onclick="togglePortalAgreement(this)" src="assets/check.svg" alt="{{kiosk.agreementChecked}}" />
          <div class="agreement-copy">
            <span>{{kiosk.agreement}}</span>
            <small>{{kiosk.agreementEn}}</small>
            <a class="agreement-notice-link" id="readmeLink" onclick="turnReadmePage();return false;" href="#">{{common.userNotice}}（{{common.userNoticeEn}}）</a>
          </div>
        </div>

        <button id="loginBtn" class="login-button is-disabled" type="button" onclick="login()">
          <span class="button-primary">{{common.login}}</span>
          <span class="button-secondary">{{common.loginEn}}</span>
        </button>
      </section>
    </main>
  </body>
</html>
