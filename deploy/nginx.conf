worker_processes auto;

error_log /opt/vue-fastapi-admin/logs/nginx/error.log warn;
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
include /usr/local/nginx/conf/mime.types;
default_type application/octet-stream;
sendfile on;
tcp_nopush on;
keepalive_timeout 65;
gzip on;

upstream fastapi_backend {
    least_conn;
    keepalive 32;

    server 127.0.0.1:19001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19002 max_fails=3 fail_timeout=10s;

    # Add the second application server after its address is assigned.
    # server SECOND_APP_SERVER_IP:19001 max_fails=3 fail_timeout=10s;
    # server SECOND_APP_SERVER_IP:19002 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /opt/vue-fastapi-admin/web/dist;
    index index.html;

    access_log /opt/vue-fastapi-admin/logs/nginx/access.log;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 4;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://fastapi_backend;
    }

    location = /api/v1/kiosk/create-guest {
        client_max_body_size 8k;
        proxy_pass http://fastapi_backend;
    }

    location = /secoWS/service/NewGuestManagerServices {
        access_log off;
        client_max_body_size 64k;
        proxy_pass http://fastapi_backend;
    }

    location = /PortalServer/AppPortalAuth {
        # Query parameters contain the legacy guest password.
        access_log off;
        proxy_pass http://fastapi_backend;
    }

    location ^~ /api/ {
        client_max_body_size 5m;
        proxy_pass http://fastapi_backend;
    }
}
}
