name: vue-fastapi-admin

x-app: &app
  image: vue-fastapi-admin-backend:${APP_IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: backend
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  restart: unless-stopped
  env_file:
    - ${APP_ENV_FILE:-/etc/vue-fastapi-admin/app.env}
  environment:
    UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
  volumes:
    - ${APP_LOG_DIR:-/srv/vue-fastapi-admin/logs/app}:/opt/vue-fastapi-admin/logs:z
  networks:
    - backend
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9999/health/ready"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 30s

services:
  app-1:
    <<: *app
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT_1:-19001}:9999"

  app-2:
    <<: *app
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT_2:-19002}:9999"

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_DOCKER_SUBNET:-10.78.0.0/24}
          gateway: ${APP_DOCKER_GATEWAY:-10.78.0.1}
