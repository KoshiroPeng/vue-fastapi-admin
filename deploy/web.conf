upstream fastapi_backend {
    least_conn;
    keepalive 32;

    server 127.0.0.1:19001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19002 max_fails=3 fail_timeout=10s;

    # Add the second application server after its address is assigned.
    # server SECOND_APP_SERVER_IP:19001 max_fails=3 fail_timeout=10s;
    # server SECOND_APP_SERVER_IP:19002 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /srv/vue-fastapi-admin/web;
    index index.html;

    access_log /var/log/nginx/vue-fastapi-admin.access.log;
    error_log /var/log/nginx/vue-fastapi-admin.error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://fastapi_backend;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/kiosk/create-guest {
        client_max_body_size 8k;
        proxy_pass http://fastapi_backend;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/ {
        client_max_body_size 5m;
        proxy_pass http://fastapi_backend;
        include /etc/nginx/proxy_params.conf;
    }
}
