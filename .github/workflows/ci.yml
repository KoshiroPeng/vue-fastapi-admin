name: CI & Docker Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  web-build:
    name: Build & Check Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Frontend
        working-directory: ./web
        run: pnpm build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-fastapi-admin-web
          path: web/dist
          if-no-files-found: error

  backend-check:
    name: Check Backend & Dependencies
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: vue_fastapi_admin
      MYSQL_PASSWORD: ci-database-password
      MYSQL_DATABASE: vue_fastapi_admin
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: vue_fastapi_admin
          MYSQL_USER: vue_fastapi_admin
          MYSQL_PASSWORD: ci-database-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Backend
        run: ruff check app tests scripts

      - name: Run Backend Tests
        run: python -m pytest -q

      - name: Validate Backend Startup & Lifespan
        run: |
          python -c "
          import asyncio
          from app import app, lifespan
          async def test():
              async with lifespan(app):
                  print('Backend lifespan validation succeeded!')
          asyncio.run(test())
          "

  docker-build:
    name: Build Backend Docker Image
    needs: [web-build, backend-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          target: backend
          push: false
          tags: vue-fastapi-admin-backend:latest
